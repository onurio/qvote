name: Deno CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.2.3

      - name: Verify formatting
        run: deno task fmt:check

      - name: Run linter
        run: deno task lint

      - name: Generate Prisma client
        run: deno task prisma:generate

      - name: Test database migrations
        run: deno run -A npm:prisma@6.4.1 migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: Run type check
        run: deno task check

      - name: Run pre-commit hook (includes tests and coverage checks)
        run: |
          # Make the pre-commit hook script executable
          chmod +x hooks/pre-commit

          # Run the pre-commit hook, which now uses check:all with coverage
          ./hooks/pre-commit
        env:
          ENV: ci
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test
          DB_PASSWORD: test
          DB_NAME: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          SLACK_CLIENT_ID: "test_client_id"
          SLACK_CLIENT_SECRET: "test_client_secret"
          SLACK_REDIRECT_URI: "https://example.com/oauth/callback"
          SLACK_SIGNING_SECRET: "test_signing_secret"
          PORT: "8443"
          USE_HTTPS: "false"
          CERT_FILE: "certs/cert.pem"
          KEY_FILE: "certs/key.pem"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.2.3

      - name: Build Docker image
        run: docker build -t qvote:${{ github.sha }} .

      # Additional deployment steps could go here

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Setup repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/git @semantic-release/exec @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator

      - name: Release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
